name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-extension-and-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Node-Abhängigkeiten installieren
        run: npm ci

      - name: TypeScript prüfen (App & Extension)
        run: |
          npm run lint
          npm run typecheck:extension

      - name: Extension-Unit-Tests ausführen
        run: npm run test:extension

      - name: Python-Backend-Tests ausführen
        run: python3 -m unittest discover -s backend/tests -p "test_*.py" -v

      - name: Extension-Build prüfen
        run: npm run build:extension
